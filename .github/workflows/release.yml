name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space (models + torch are big)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/leovvay/vymova:latest
            ghcr.io/leovvay/vymova:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub Release with the launcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "launcher/запустить.bat" vymova-zapusk.bat
          gh release create "${{ github.ref_name }}" vymova-zapusk.bat \
            --title "Vymova ${{ github.ref_name }}" \
            --notes "Скачайте vymova-zapusk.bat и запустите двойным кликом. Инструкция — в README."
