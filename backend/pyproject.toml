[project]
name = "vymova"
version = "0.1.0"
description = "Разбор ошибок произношения студентов по записи урока украинского"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
ml = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "torch>=2.3",
  "transformers>=4.44",
  "huggingface_hub>=0.24",
]

[project.scripts]
vymova = "vymova.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vymova"]
