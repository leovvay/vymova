[project]
name = "vymova"
version = "0.1.0"
description = "Разбор ошибок произношения студентов по записи урока украинского"
requires-python = ">=3.11"
# версии зафиксированы: образ обновляется у репетитора сам (:latest), сборка должна быть воспроизводимой
dependencies = [
  "fastapi==0.162.0",
  "uvicorn[standard]==0.54.0",
  "httpx==0.28.1",
  "pydantic==2.14.1",
  "jinja2==3.1.6",
  "python-multipart==0.0.32",
]

[project.optional-dependencies]
ml = [
  "numpy==2.5.4",
  "soundfile==0.14.0",
  "torch==2.14.1",
  "transformers==5.21.0",
  "tokenizers==0.23.3",
  "safetensors==0.8.0",
  "huggingface_hub==2.3.0",
]

[project.scripts]
vymova = "vymova.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vymova"]
